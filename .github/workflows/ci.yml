name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub's default is six hours. Most of this job drives real browsers across
    # three engines and several tabs, and a wedged page or an un-elected leader
    # hangs rather than fails — so without a bound the failure mode is a run that
    # looks busy all afternoon instead of one that goes red in minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # Builds every package, then runs: engine + client suites, the no-Worker
      # runtime suite, both adversarial suites, the generated Dexie compat audit
      # (which FAILS if we regress), and the codemod fixtures.
      # Runs the Dexie PARITY suite among others: the same script against the real
      # dexie package and against granth, diffing the answers. The name-walking
      # compat audit cannot catch a method that exists and returns the wrong
      # thing — which is how 19 defects, one of them a row-destroying delete,
      # stayed invisible to a fully green suite.
      # Every outbound call is blocked, so the suite cannot quietly grow a network
      # dependency again. The docs-coverage gate used to fetch the site repo on
      # each run: it failed with no network, and an edit in another repository
      # could redden this CI without a line changing here. Blocking beats
      # unplugging — a test that retried or swallowed the error would survive a
      # no-wifi check and still be coupled.
      - run: NODE_OPTIONS="--import file://$PWD/scripts/no-network.mjs" npm test
      # The Node suites cannot see OPFS, the opfs-sahpool VFS, dedicated Workers
      # or Web Locks. Without this job a change can be green in Node and broken
      # in every browser — which has happened.
      # Cached, so a warm run skips the download of three browser builds.
      #
      # `--with-deps` stays, unlike the site's chromium-only job which dropped
      # it: WebKit needs libraries ubuntu-latest genuinely does not ship
      # (libwoff2, libhyphen, libmanette, gstreamer), so removing it here trades
      # a slow run for a broken one.
      #
      # That leaves this step exposed to apt. It cost 28 minutes on one run —
      # all of it azure.archive.ubuntu.com stalling on FONT packages Playwright
      # installs for non-Latin rendering, which nothing here needs but which
      # come as an explicit part of its dependency set rather than as
      # recommends, so there is no flag to skip them. The 30-minute bound above
      # turns that into a red run in half an hour instead of a six-hour hang.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node examples/playground/browser-test.mjs
      # The README claims Chrome 108+, Safari 16.4+ and Firefox 111+. Testing one
      # engine left two thirds of that claim unverified — and WebKit is the one
      # that matters most, because it has no working OPFS here and therefore
      # exercises the IndexedDB fallback the way Safari private browsing does.
      #
      # NOT Safari itself: Playwright's WebKit is a different build, so this
      # narrows the gap rather than closing it.
      - run: BROWSER=firefox node examples/playground/browser-test.mjs
      - run: BROWSER=webkit node examples/playground/browser-test.mjs
      # Multi-tab is where the worst bugs live: schema loss on failover, writes
      # absorbed by an abandoned transaction, transactions merging. None of it is
      # reachable from a single page. Two tabs and three tabs behave DIFFERENTLY
      # — with two, the survivor elects itself — so both run.
      - run: node examples/playground/twotab-test.mjs
      - run: node examples/playground/concurrency-test.mjs
      # The sandbox is the first thing a visitor tries, so every bundled example
      # must actually run. This already caught a demo querying an index the
      # sandbox schema never declared.
      - run: node examples/playground/sandbox-test.mjs
      # A REAL Dexie application migrated end to end: 2,700 rows, an explicit
      # string primary key, a unique index, a compound index and a multiEntry
      # array — then every query asked of BOTH databases and the answers diffed.
      # The old check migrated two rows, which is a smoke test, not a migration.
      - run: node examples/playground/migration-test.mjs
      # Six frameworks, one check each: mount, type a todo, assert it appears. A
      # demo that renders an empty shell photographs fine and is useless.
      - run: node examples/playground/demos-test.mjs
