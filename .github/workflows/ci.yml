name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # Builds every package, then runs: engine + client suites, the no-Worker
      # runtime suite, both adversarial suites, the generated Dexie compat audit
      # (which FAILS if we regress), and the codemod fixtures.
      - run: npm test
      - run: npm run docs:build
