name: Docs
on:
  # examples/playground and the packages are BUILT INTO the site (the sandbox and
  # demos live under /play/), so a change to either must redeploy it too.
  push:
    branches: [main]
    paths: ['docs/**', 'examples/playground/**', 'packages/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # The sandbox and demos import the workspace packages from their dist/,
      # which a fresh `npm ci` does not produce — without this the site builds
      # with no /play/ at all, or fails resolving `granthdb`.
      - run: npm run build
      - run: npm run docs:build
      # link-check is pure Node and takes seconds, so the deploy still refuses to
      # ship broken links or a dead redirect.
      #
      # The BROWSER checks (hosted-play-test, flash-probe) deliberately do NOT run
      # here. CI runs them on this same commit, and `playwright install
      # --with-deps` turned a two-minute deploy into an eighteen-minute one that
      # then hung — paying twice for the same evidence, on the job whose whole
      # value is being fast and dependable.
      - run: node examples/playground/link-check.mjs
      # Cheap (no browser install beyond what link-check needs) and it guards the
      # landing page's primary call to action, which 404'd for every human while
      # every fetch-based check said 200.
      - run: npx playwright install --with-deps chromium
      - run: node examples/playground/spa-exit-test.mjs
      # enablement:true lets the action turn Pages on itself; without it the run
      # fails with "Get Pages site failed" until someone flips the setting by hand.
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/.vitepress/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
