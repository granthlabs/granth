<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>granthdb sandbox</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161c; --panel: #1a1d25; --line: #2a2f3a;
    --text: #e8eaf0; --dim: #9aa3b4; --accent: #7fb4ff; --bad: #ff8f8f; --good: #86e0a8;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
  .meta { font: 12px var(--mono); color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; min-height: calc(100vh - 66px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { padding: 20px 24px; min-width: 0; }
  section + section { border-left: 1px solid var(--line); }
  @media (max-width: 900px) { section + section { border-left: none; border-top: 1px solid var(--line); } }
  h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); font-weight: 600; }
  #code {
    width: 100%; min-height: 220px; padding: 14px; resize: vertical;
    background: #10131a; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    font: 13px/1.65 var(--mono); tab-size: 2;
  }
  #code:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; padding: 10px 18px; border-radius: 7px; cursor: pointer;
    background: var(--accent); color: #10131a; border: 1px solid var(--accent);
  }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  button:disabled { opacity: 0.5; cursor: default; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; font-size: 13px; }
  .hint { color: var(--dim); font-size: 12px; }
  pre { margin: 0; padding: 14px; background: #10131a; border: 1px solid var(--line); border-radius: 8px;
        font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 46vh; overflow: auto; }
  .err { color: var(--bad); }
  .ok { color: var(--good); }
  table { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); margin-top: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
</style>

<header>
  <h1>granthdb sandbox</h1>
  <span class="meta" id="env">booting…</span>
</header>

<main>
  <section>
    <h2>Try a query</h2>
    <label class="hint" for="examples">Load an example</label>
    <div class="row">
      <select id="examples" aria-label="Load an example"></select>
      <button class="ghost" id="reset" type="button">Reseed data</button>
    </div>

    <div class="row" style="margin-top:14px; width:100%">
      <textarea id="code" spellcheck="false" aria-label="Query code"></textarea>
    </div>

    <div class="row">
      <button id="run" type="button">Run</button>
      <span class="hint">⌘/Ctrl + Enter</span>
      <span class="hint" id="timing"></span>
    </div>

    <p class="hint" style="margin-top:16px">
      Everything runs locally in your browser against a real SQLite database in OPFS.
      Nothing is uploaded. <code>db</code> is in scope — try <code>db.friends</code>.
    </p>
  </section>

  <section>
    <h2>Result</h2>
    <pre id="out">Run something.</pre>
    <div id="table"></div>
  </section>
</main>

<script type="module" src="./sandbox.js"></script>
